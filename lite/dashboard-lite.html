let sortKey = null, sortDir = 1;
function cols(){return DATA.length?Object.keys(DATA[0]):[]}
function curated(){
  const notes={}
  // build a few headline cards from numeric columns
  const c = cols(); const cards=[];
  c.forEach(k=>{
    const vals=DATA.map(r=>r[k]).filter(v=>typeof v==='number');
    if(vals.length>DATA.length*0.5){
      const sum=vals.reduce((a,b)=>a+b,0);
      cards.push([k, (sum>=100000? '$'+Math.round(sum).toLocaleString() : Math.round(sum).toLocaleString())]);
    }
  });
  return cards.slice(0,4);
}
function render(){
  const cards=curated();
  document.getElementById('cards').innerHTML=cards.map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  const q=(document.getElementById('q').value||'').toLowerCase();
  let rows=DATA.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
  if(sortKey) rows=rows.slice().sort((a,b)=>{const x=a[sortKey],y=b[sortKey];return (x>y?1:x<y?-1:0)*sortDir});
  const c=cols();
  let h='<thead><tr>'+c.map(k=>`<th onclick="sortBy('${k}')">${k}</th>`).join('')+'</tr></thead><tbody>';
  h+=rows.map(r=>'<tr>'+c.map(k=>`<td>${fmt(r[k])}</td>`).join('')+'</tr>').join('');

}
function fmt(v){if(v===true)return '<span class="pill p-ok">yes</span>';if(v===false)return '<span class="pill p-warn">no</span>';return v}
function sortBy(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1}render()}
function exportCsv(){
  const c=cols();const lines=[c.join(',')].concat(DATA.map(r=>c.map(k=>`"${String(r[k]).replace(/"/g,'""')}"`).join(',')));
